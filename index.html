<style>

:root{
  --primary:#00C2FF;
  --dark:#081A2C;
  --dark2:#0D243A;
  --light:#F8FAFC;
  --white:#FFFFFF;
  --text:#334155;
  --muted:#64748B;
  --orange:#FF7B38;
  --success:#10B981;
  --radius:20px;
  --shadow:0 20px 60px rgba(0,0,0,.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

img{
  max-width:100%;
  display:block;
}

a{
  text-decoration:none;
}

.container{
  width:min(1280px,92%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

.site-header{
  position:sticky;
  top:0;
  z-index:999;

  background:rgba(255,255,255,.96);

  backdrop-filter:blur(14px);

  border-bottom:1px solid rgba(0,0,0,.06);
}

.navbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  min-height:80px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;

  font-size:1.4rem;
  font-weight:900;
  color:var(--dark);
}

.logo-icon{
  font-size:1.7rem;
}

.main-nav{
  display:flex;
  gap:32px;
  align-items:center;
}

.main-nav a{
  color:var(--dark);
  font-weight:600;
  transition:.3s;
}

.main-nav a:hover{
  color:var(--primary);
}

.nav-buttons{
  display:flex;
  gap:12px;
}

.btn{
  border:none;
  cursor:pointer;
  transition:.3s;
  font-weight:700;
}

.btn-login{
  background:#E2E8F0;
  padding:12px 22px;
  border-radius:999px;
  color:var(--dark);
}

.btn-primary{
  background:var(--primary);
  color:white;
  padding:12px 24px;
  border-radius:999px;
}

.btn-primary:hover{
  transform:translateY(-2px);
}

/* =========================
   HERO
========================= */

.hero{

  background:

  linear-gradient(
  135deg,
  rgba(8,26,44,.95),
  rgba(13,36,58,.92)
  ),

  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600');

  background-size:cover;

  background-position:center;

  padding:120px 0 140px;

  color:white;
}

.hero-inner{
  max-width:760px;
}

.eyebrow{

  display:inline-block;

  background:rgba(255,255,255,.15);

  border:1px solid rgba(255,255,255,.15);

  padding:8px 16px;

  border-radius:999px;

  font-size:.9rem;

  margin-bottom:25px;
}

.hero h1{

  font-size:clamp(3rem,7vw,5.5rem);

  line-height:1.05;

  font-weight:900;

  margin-bottom:25px;
}

.hero p{

  font-size:1.2rem;

  color:#D6E2F0;

  margin-bottom:40px;

  max-width:700px;
}

.hero-search{

  background:white;

  border-radius:24px;

  display:flex;

  gap:10px;

  padding:12px;

  box-shadow:var(--shadow);

  margin-top:30px;
}

.hero-search input{

  flex:1;

  border:none;

  outline:none;

  font-size:1rem;

  padding:18px;
}

.hero-search button{

  min-width:180px;

  background:var(--orange);

  color:white;

  border:none;

  border-radius:16px;

  font-weight:800;

  cursor:pointer;
}

.hero-stats{

  margin-top:50px;

  display:flex;

  gap:60px;

  flex-wrap:wrap;
}

.stat-number{

  font-size:2rem;

  font-weight:900;
}

.stat-label{

  color:#C3D3E3;
}

/* =========================
   CATEGORY SECTION
========================= */

.categories{

  padding:100px 0;
}

.section-header{
  text-align:center;
  margin-bottom:60px;
}

.section-header h2{

  font-size:clamp(2rem,5vw,3.5rem);

  color:var(--dark);

  margin-bottom:15px;
}

.section-header p{

  max-width:700px;

  margin:auto;

  color:var(--muted);
}

.category-grid{

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:24px;
}

.category-card{

  padding:35px;

  background:white;

  border-radius:24px;

  box-shadow:
  0 8px 30px rgba(0,0,0,.08);

  transition:.3s;
}

.category-card:hover{

  transform:translateY(-8px);
}

.category-icon{

  font-size:2.5rem;

  margin-bottom:15px;
}

.category-card h3{
  margin-bottom:10px;
  color:var(--dark);
}

.category-card p{
  color:var(--muted);
}

/* =========================
   FEATURED PARTNER
========================= */

.featured-partner{

  padding:100px 0;

  background:#F8FAFC;
}

.partner-wrap{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:60px;

  align-items:center;
}

.partner-image{

  background:

  linear-gradient(
  135deg,
  #00C2FF,
  #0EA5E9
  );

  min-height:500px;

  border-radius:30px;

  position:relative;

  overflow:hidden;
}

.partner-badge{

  position:absolute;

  top:30px;

  left:30px;

  background:white;

  color:var(--dark);

  padding:10px 18px;

  border-radius:999px;

  font-weight:800;
}

.partner-content h2{

  font-size:3rem;

  margin-bottom:20px;

  color:var(--dark);
}

.partner-content p{

  color:var(--muted);

  margin-bottom:25px;
}

.partner-buttons{

  display:flex;

  gap:15px;

  flex-wrap:wrap;
}

.partner-buttons a{

  padding:14px 22px;

  border-radius:14px;

  font-weight:800;
}

.partner-main{

  background:var(--primary);

  color:white;
}

.partner-secondary{

  background:var(--dark);

  color:white;
}
